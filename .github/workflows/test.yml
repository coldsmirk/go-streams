name: Test

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

# The repository holds two modules: the v1 module at the root and the v2 module
# in v2/, which requires Go 1.27 for generic methods. Every job runs against
# both, each on the Go version its go.mod declares.
jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1
            dir: .
            go: '1.25'
          - name: v2
            dir: v2
            go: '1.27'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Download Go modules
        working-directory: ${{ matrix.dir }}
        run: go mod download

      - name: Run go vet
        working-directory: ${{ matrix.dir }}
        run: go vet ./...

      - name: Check formatting
        working-directory: ${{ matrix.dir }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Tests with Coverage
        working-directory: ${{ matrix.dir }}
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ matrix.dir }}/coverage.txt
          flags: ${{ matrix.name }}
          fail_ci_if_error: false
          verbose: true

  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1
            dir: .
            go: '1.25'
          - name: v2
            dir: v2
            go: '1.27'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.dir }}
          args: --timeout=5m

  modernize:
    name: Modernize (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1
            dir: .
            go: '1.25'
          - name: v2
            dir: v2
            go: '1.27'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Run modernize analyzer
        working-directory: ${{ matrix.dir }}
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...
